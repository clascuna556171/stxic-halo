[package]
name = "stxic-halo"
version = "0.1.0"
description = "STXIC Halo local desktop companion"
authors = ["STXIC"]
edition = "2021"
license = "MIT"

[lib]
name = "stxic_halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
