name: Halo CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
  # Add verified Tauri Rust compilation and signed installer workflow separately.
  # Do not attach unreviewed unsigned executables to public releases.
